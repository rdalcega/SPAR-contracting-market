# Smoke run on Google Cloud: every seat and the summarizer on Gemini 3.8 Flash through Vertex AI's OpenAI-compatible
# endpoint (provider vertex, market/vertex.py), all message channels on, in a short episode (about 3 days). Needs the
# gcloud CLI logged in (`gcloud auth login`) with access to the project in base_url; calls are billed to that
# project. Prices: Vertex's introductory Gemini 3.8 Flash rate, $0.75 / $3.75 per 1M input / output tokens, valid
# through 2026-12-31 (Google's Vertex AI pricing page, checked 2026-11-26).
seeds: [0]
parallel_episodes: 1
cost_cap_usd: 2
name: vertex_gemini38flash_smoke
message_channels: all
time: {horizon_min_days: 2, horizon_end_prob: 0.9, close_after_due_days: 1}
value: {late_decay: 1}
tasks: {due_days_range: [1, 2]}
models:
  buyers: &gemini
    provider: vertex
    base_url: https://aiplatform.googleapis.com/v1/projects/silicoase-researchers-agora/locations/global/endpoints/openapi
    model: google/gemini-3.8-flash
    price_in_per_m: 0.75
    price_out_per_m: 3.75
  managers: *gemini
  summarizer: *gemini
